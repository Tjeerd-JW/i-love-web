<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @font-face {
            font-family: 'google sans';
            src: url('../../public/fonts/Google_Sans_Flex/GoogleSansFlex-VariableFont_GRAD\,ROND\,opsz\,slnt\,wdth\,wght.ttf');
        }

        @keyframes font-move {
            0% {
                font-variation-settings: "wdth" 100, "wght" 400, "GRAD" 0, "ROND" 0, "slnt" 0;
            }

            10% {
                font-variation-settings: "wdth" 185, "wght" 850, "GRAD" 30, "ROND" 75, "slnt" -15;
            }

            20% {
                font-variation-settings: "wdth" 115, "wght" 620, "GRAD" -20, "ROND" 20, "slnt" 8;
            }

            30% {
                font-variation-settings: "wdth" 240, "wght" 980, "GRAD" 10, "ROND" 100, "slnt" -35;
            }

            40% {
                font-variation-settings: "wdth" 75, "wght" 300, "GRAD" -40, "ROND" 5, "slnt" 20;
            }

            50% {
                font-variation-settings: "wdth" 260, "wght" 1000, "GRAD" 0, "ROND" 90, "slnt" -100;
            }

            60% {
                font-variation-settings: "wdth" 130, "wght" 720, "GRAD" 50, "ROND" 35, "slnt" 12;
            }

            70% {
                font-variation-settings: "wdth" 210, "wght" 450, "GRAD" -10, "ROND" 100, "slnt" -50;
            }

            80% {
                font-variation-settings: "wdth" 90, "wght" 920, "GRAD" 20, "ROND" 10, "slnt" 30;
            }

            90% {
                font-variation-settings: "wdth" 170, "wght" 550, "GRAD" -30, "ROND" 65, "slnt" -8;
            }

            100% {
                font-variation-settings: "wdth" 100, "wght" 400, "GRAD" 0, "ROND" 0, "slnt" 0;
            }
        }

        h1 {
            font-family: 'google sans';
            font-variation-settings: "wdth" 100, "wght" 400, "GRAD" 0, "ROND" 0, "slnt" 0;
            font-size: 4vw;
            text-align: center;
            animation: font-move 20s infinite ease-in-out;
        }
    </style>
</head>

<body>
    <h1>Modular scale super cool enzo</h1>
</body>

</html>
